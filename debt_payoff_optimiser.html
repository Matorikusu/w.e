<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debt Payoff Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0f17;
      --bg-card: #131926;
      --bg-card-hover: #192233;
      --border-color: #232d42;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent-primary: #3b82f6;
      --accent-primary-hover: #2563eb;
      --accent-success: #10b981;
      --accent-warning: #f59e0b;
      --accent-danger: #ef4444;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    /* Sticky Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 15, 23, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 1.5rem;
    }

    .header-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-badge {
      background: var(--accent-primary);
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .select-styled {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: 0.875rem;
      cursor: pointer;
      outline: none;
    }

    .btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.5rem 1rem;
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--text-muted);
    }

    .btn-primary {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-primary-hover);
      border-color: var(--accent-primary-hover);
    }

    .btn-danger {
      color: var(--accent-danger);
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.1);
      border-color: var(--accent-danger);
    }

    /* Container Layout */
    .container {
      max-width: 1200px;
      margin: 2rem auto 0;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    @media (min-width: 992px) {
      .container {
        grid-template-columns: 420px 1fr;
      }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Controls Panel */
    .strategy-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg-main);
      padding: 4px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
    }

    .toggle-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: calc(var(--radius-sm) - 2px);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .toggle-btn.active {
      background: var(--accent-primary);
      color: #fff;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .input-styled {
      width: 100%;
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.6rem 0.8rem;
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      outline: none;
    }

    .input-styled:focus {
      border-color: var(--accent-primary);
    }

    .slider {
      width: 100%;
      accent-color: var(--accent-primary);
    }

    /* Debt Entry List */
    .debt-item {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 1rem;
      margin-bottom: 0.75rem;
      position: relative;
    }

    .debt-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .debt-item-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    /* Dashboard & Analytics */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .metric-card {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      padding: 1rem;
    }

    .metric-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .metric-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .metric-value.success {
      color: var(--accent-success);
    }

    .chart-container {
      width: 100%;
      height: 250px;
      margin-top: 1rem;
    }

    svg.chart {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Table Styling */
    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
      text-align: left;
    }

    th, td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background: var(--bg-main);
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Strategy Info Boxes */
    .info-box {
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: var(--radius-sm);
      padding: 1rem;
      margin-top: 1rem;
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .info-box strong {
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header class="header">
    <div class="header-content">
      <div class="logo">
        Debt Payoff Engine
        <span class="logo-badge">Pro</span>
      </div>
      <div class="header-controls">
        <select id="currencySelect" class="select-styled">
          <option value="$">USD ($)</option>
          <option value="£">GBP (£)</option>
          <option value="€">EUR (€)</option>
        </select>
        <button id="exportBtn" class="btn">Export CSV</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Left Column: Controls & Input -->
    <section>
      <div class="card">
        <div class="card-title">Strategy Engine</div>
        
        <div class="strategy-toggle">
          <button id="avalancheBtn" class="toggle-btn active" onclick="setStrategy('avalanche')">Avalanche (APR)</button>
          <button id="snowballBtn" class="toggle-btn" onclick="setStrategy('snowball')">Snowball (Balance)</button>
        </div>

        <div class="form-group">
          <div class="form-label">Extra Monthly Payment</div>
          <div class="input-row">
            <input type="range" id="extraSlider" class="slider" min="0" max="2000" step="25" value="200" oninput="syncExtraInput(this.value)">
            <input type="number" id="extraInput" class="input-styled" style="width: 100px;" value="200" min="0" oninput="syncExtraSlider(this.value)">
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          Debts
          <button class="btn btn-primary" style="font-size: 0.75rem; padding: 4px 8px;" onclick="addDebt()">+ Add Debt</button>
        </div>
        <div id="debtList"></div>
      </div>

      <div class="card">
        <div class="card-title">Strategy Comparison</div>
        <div class="info-box" id="strategyExplanation">
          <!-- Populated by JS -->
        </div>
      </div>
    </section>

    <!-- Right Column: Analytics & Visualization -->
    <section>
      <div class="card">
        <div class="card-title">Dashboard Overview</div>
        <div class="metrics-grid">
          <div class="metric-card">
            <div class="metric-label">Time to Debt-Free</div>
            <div class="metric-value" id="metricTime">0 mos</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">Total Interest Paid</div>
            <div class="metric-value" id="metricInterest">$0</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">Interest Saved vs Min</div>
            <div class="metric-value success" id="metricSaved">$0</div>
          </div>
        </div>

        <div class="card-title" style="font-size: 0.95rem;">Payoff Trajectory</div>
        <div class="chart-container">
          <svg class="chart" id="payoffChart" viewBox="0 0 500 200" preserveAspectRatio="none">
            <!-- Dynamic SVG Path -->
          </svg>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Amortization & Yearly Breakdown</div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Year</th>
                <th>Principal Paid</th>
                <th>Interest Paid</th>
                <th>Total Payments</th>
                <th>Remaining Balance</th>
              </tr>
            </thead>
            <tbody id="scheduleBody">
              <!-- Dynamic Rows -->
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script>
    // --- Application State ---
    let currency = '$';
    let currentStrategy = 'avalanche';
    let extraPayment = 200;
    let debts = [
      { id: 1, name: 'Credit Card A', balance: 5000, rate: 22.9, min: 120 },
      { id: 2, name: 'Car Loan', balance: 12000, rate: 6.5, min: 280 },
      { id: 3, name: 'Personal Loan', balance: 3500, rate: 14.2, min: 90 }
    ];

    // --- Core Payoff Engine with Recycling Logic ---
    function simulatePayoff(debtList, extraMonthly, strategy) {
      let activeDebts = debtList.map(d => ({
        ...d,
        balance: parseFloat(d.balance),
        min: parseFloat(d.min),
        rate: parseFloat(d.rate)
      }));

      let months = 0;
      let totalInterest = 0;
      let totalPaid = 0;
      let trajectory = [];
      let yearlySchedule = [];

      let availableExtra = parseFloat(extraMonthly) || 0;
      const initialTotal = activeDebts.reduce((s, d) => s + d.balance, 0);
      trajectory.push(initialTotal);

      let yearInterest = 0, yearPrincipal = 0, yearPayments = 0;

      while (activeDebts.some(d => d.balance > 0.01) && months < 600) {
        months++;

        // 1. Sort priority debt target based on strategy
        if (strategy === 'avalanche') {
          activeDebts.sort((a, b) => b.rate - a.rate);       // highest APR first
        } else {
          activeDebts.sort((a, b) => a.balance - b.balance);   // lowest balance first
        }

        let monthInterest = 0;
        let monthPrincipal = 0;
        let monthPayments = 0;
        let freedMinimums = 0; // Minimums freed this month added to extra pool next month

        // 2. Accrue monthly interest & pay minimums on every open debt
        activeDebts.forEach(d => {
          if (d.balance <= 0) return;

          const monthlyRate = (d.rate / 100) / 12;
          const interest = d.balance * monthlyRate;
          d.balance += interest;
          monthInterest += interest;

          const minPay = Math.min(d.min, d.balance);
          d.balance -= minPay;
          monthPayments += minPay;
          monthPrincipal += Math.max(0, minPay - interest);

          // If payment closes debt, free its minimum for subsequent months
          if (d.balance <= 0.01) {
            d.balance = 0;
            freedMinimums += d.min;
          }
        });

        // 3. Apply extra payment pool to priority debt(s)
        let pool = availableExtra;
        for (const d of activeDebts) {
          if (d.balance <= 0 || pool <= 0) continue;

          const extraPay = Math.min(pool, d.balance);
          d.balance -= extraPay;
          pool -= extraPay;
          monthPayments += extraPay;
          monthPrincipal += extraPay;

          if (d.balance <= 0.01) {
            d.balance = 0;
            freedMinimums += d.min; // also free minimum if extra payment cleared it
          }
        }

        // 4. Increase extra payment pool for future months (snowballing/recycling)
        availableExtra += freedMinimums;

        totalInterest += monthInterest;
        totalPaid += monthPayments;

        yearInterest += monthInterest;
        yearPrincipal += monthPrincipal;
        yearPayments += monthPayments;

        const remaining = activeDebts.reduce((s, d) => s + Math.max(0, d.balance), 0);

        if (months % 12 === 0 || remaining <= 0) {
          yearlySchedule.push({
            year: Math.ceil(months / 12),
            principalPaid: yearPrincipal,
            interestPaid: yearInterest,
            totalPayments: yearPayments,
            remainingBalance: remaining
          });
          trajectory.push(remaining);
          yearInterest = yearPrincipal = yearPayments = 0;
        }

        if (remaining <= 0) break;
      }

      return { months, totalInterest, totalPaid, trajectory, yearlySchedule };
    }

    // --- Dynamic Rendering & Logic Execution ---
    function render() {
      // 1. Run simulation with recycling logic
      const result = simulatePayoff(debts, extraPayment, currentStrategy);
      const minOnlyResult = simulatePayoff(debts, 0, 'none');

      // 2. Update Overview Dashboard Metrics
      const years = Math.floor(result.months / 12);
      const mos = result.months % 12;
      document.getElementById('metricTime').innerText = `${years > 0 ? years + 'y ' : ''}${mos}m`;
      document.getElementById('metricInterest').innerText = formatCurrency(result.totalInterest);

      const saved = Math.max(0, minOnlyResult.totalInterest - result.totalInterest);
      document.getElementById('metricSaved').innerText = formatCurrency(saved);

      // 3. Render Chart
      renderChart(result.trajectory, minOnlyResult.trajectory);

      // 4. Render Table
      const scheduleBody = document.getElementById('scheduleBody');
      scheduleBody.innerHTML = '';
      result.yearlySchedule.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>Year ${row.year}</td>
          <td>${formatCurrency(row.principalPaid)}</td>
          <td>${formatCurrency(row.interestPaid)}</td>
          <td>${formatCurrency(row.totalPayments)}</td>
          <td>${formatCurrency(row.remainingBalance)}</td>
        `;
        scheduleBody.appendChild(tr);
      });

      // 5. Update Strategy Info
      const info = document.getElementById('strategyExplanation');
      if (currentStrategy === 'avalanche') {
        info.innerHTML = `<strong>Avalanche Strategy:</strong> Targets debts with the highest Interest Rate (APR) first. Mathematically optimal to minimize total interest paid over time. Paid-off minimum payments are recycled directly into your extra payment pool.`;
      } else {
        info.innerHTML = `<strong>Snowball Strategy:</strong> Targets debts with the lowest Balance first. Delivers rapid psychological wins by quickly eliminating individual debts. Freed minimum payments stack onto future targets.`;
      }

      saveState();
    }

    // --- SVG Visual Trajectory Generator ---
    function renderChart(activeTrajectory, baselineTrajectory) {
      const svg = document.getElementById('payoffChart');
      svg.innerHTML = '';

      const width = 500;
      const height = 200;
      const padding = 10;

      const maxVal = Math.max(...baselineTrajectory, ...activeTrajectory, 1);
      const totalSteps = Math.max(baselineTrajectory.length, activeTrajectory.length, 1);

      function buildPath(data, strokeColor, strokeWidth, dashArray = "") {
        if (data.length === 0) return;
        const points = data.map((val, idx) => {
          const x = padding + (idx / (totalSteps - 1 || 1)) * (width - 2 * padding);
          const y = height - padding - (val / maxVal) * (height - 2 * padding);
          return `${x},${y}`;
        });

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', `M ${points.join(' L ')}`);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', strokeColor);
        path.setAttribute('stroke-width', strokeWidth);
        if (dashArray) path.setAttribute('stroke-dasharray', dashArray);
        svg.appendChild(path);
      }

      // Render Baseline (Minimum Payment Only trajectory in subtle dashed red)
      buildPath(baselineTrajectory, '#ef4444', '2', '4 4');
      // Render Active Recycled Payment Trajectory in solid Accent Blue
      buildPath(activeTrajectory, '#3b82f6', '3');
    }

    // --- UI Controls & Event Listeners ---
    function renderDebtsList() {
      const list = document.getElementById('debtList');
      list.innerHTML = '';

      debts.forEach((debt, index) => {
        const item = document.createElement('div');
        item.className = 'debt-item';
        item.innerHTML = `
          <div class="debt-item-header">
            <input type="text" class="input-styled" value="${debt.name}" style="font-weight: 600;" onchange="updateDebt(${index}, 'name', this.value)">
            <button class="btn btn-danger" style="padding: 2px 6px; font-size: 0.75rem;" onclick="removeDebt(${index})">✕</button>
          </div>
          <div class="debt-item-grid">
            <div>
              <label class="form-label">Balance</label>
              <input type="number" class="input-styled" value="${debt.balance}" onchange="updateDebt(${index}, 'balance', this.value)">
            </div>
            <div>
              <label class="form-label">APR (%)</label>
              <input type="number" class="input-styled" value="${debt.rate}" step="0.1" onchange="updateDebt(${index}, 'rate', this.value)">
            </div>
            <div style="grid-column: span 2;">
              <label class="form-label">Minimum Monthly Payment</label>
              <input type="number" class="input-styled" value="${debt.min}" onchange="updateDebt(${index}, 'min', this.value)">
            </div>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function addDebt() {
      debts.push({ id: Date.now(), name: 'New Debt', balance: 1000, rate: 10.0, min: 25 });
      renderDebtsList();
      render();
    }

    function removeDebt(index) {
      debts.splice(index, 1);
      renderDebtsList();
      render();
    }

    function updateDebt(index, field, value) {
      debts[index][field] = field === 'name' ? value : parseFloat(value) || 0;
      render();
    }

    function setStrategy(strat) {
      currentStrategy = strat;
      document.getElementById('avalancheBtn').classList.toggle('active', strat === 'avalanche');
      document.getElementById('snowballBtn').classList.toggle('active', strat === 'snowball');
      render();
    }

    function syncExtraInput(val) {
      extraPayment = parseFloat(val) || 0;
      document.getElementById('extraInput').value = extraPayment;
      render();
    }

    function syncExtraSlider(val) {
      extraPayment = parseFloat(val) || 0;
      document.getElementById('extraSlider').value = extraPayment;
      render();
    }

    function formatCurrency(amount) {
      return currency + amount.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    // --- Export CSV Implementation ---
    function exportCSV() {
      const result = simulatePayoff(debts, extraPayment, currentStrategy);
      let csvContent = "data:text/csv;charset=utf-8,";
      csvContent += "Year,Principal Paid,Interest Paid,Total Payments,Remaining Balance\n";

      result.yearlySchedule.forEach(row => {
        csvContent += `${row.year},${row.principalPaid.toFixed(2)},${row.interestPaid.toFixed(2)},${row.totalPayments.toFixed(2)},${row.remainingBalance.toFixed(2)}\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `debt_payoff_schedule_${currentStrategy}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // --- State Persistence ---
    function saveState() {
      const state = { currency, currentStrategy, extraPayment, debts };
      localStorage.setItem('debt_payoff_state', JSON.stringify(state));
    }

    function loadState() {
      const saved = localStorage.getItem('debt_payoff_state');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          currency = parsed.currency || '$';
          currentStrategy = parsed.currentStrategy || 'avalanche';
          extraPayment = parsed.extraPayment || 200;
          debts = parsed.debts || debts;

          document.getElementById('currencySelect').value = currency;
          document.getElementById('extraInput').value = extraPayment;
          document.getElementById('extraSlider').value = extraPayment;
          setStrategy(currentStrategy);
        } catch (e) {
          console.error("Error loading saved state", e);
        }
      }
    }

    // --- Event Listeners ---
    document.getElementById('currencySelect').addEventListener('change', (e) => {
      currency = e.target.value;
      render();
    });

    document.getElementById('exportBtn').addEventListener('click', exportCSV);

    // --- Initialization ---
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderDebtsList();
      render();
    });
  </script>
</body>
</html>
